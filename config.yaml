base_folder: "/Volumes/T7-1TB/TimeSnapper-imgs"

projects:
  - "WBD Prototype"
  - "PEGASAS"
  - "Geocodio"
  - "OSMI"
  - "questlog"

# Per-project aliases improve resolution (tokens, repo names, Jira keys, domains, etc.).
# Add whatever you commonly see in titles/URLs.
project_aliases:
  "WBD Prototype": ["wbd", "wbd-prototype", "neo", "adjuster", "aj", "snowflake", "okta"]
  "PEGASAS": ["pegasas", "pegasas-silex", "pegasas.aero", "silex"]
  "Geocodio": ["geocodio", "geocod.io", "api.geocod.io"]
  "OSMI": ["osmi", "osmihelp.org", "mental health", "handbook"]
  "questlog": ["questlog", "funkatron/questlog", "github.com/funkatron/questlog"]

blocklist_apps:
  - "1Password"
  - "Bitwarden"
  - "Messages"
  - "FaceTime"
  - "Banktivity"

ollama:
  enabled: true
  endpoint: "http://localhost:11434/api/generate"

  # OCR Model - for extracting text from images
  ocr:
    model: "llava:7b"  # Use llava for better text extraction (moondream wasn't working)
    send_image: true

  # Summarization Model - for generating summaries and task classification
  summarization:
    model: "tinydolphin:latest"  # Fast small model that works reliably
    send_image: false

  # Vision Analysis - for holistic scene understanding (primary analysis method)
  vision_analysis:
    model: "llava:7b"  # Vision model for scene understanding (better than moondream for this task)
    enabled: true  # Enable vision-first analysis

openai:
  enabled: false
  model: "gpt-4o-mini"
  api_base: "https://api.openai.com/v1"
  api_key_env: "OPENAI_API_KEY"
  send_image: true

confidence_threshold: 0.65
grace_gap_seconds: 120
max_ocr_lines: 40
logfile: "questlog.log"
log_max_bytes: 1048576
log_backups: 2
