[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "questlog"
version = "0.1.0"
description = "On-device activity logging from periodic screenshots"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Questlog Contributors"}
]
keywords = ["activity-logging", "screenshots", "ocr", "llm", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "watchdog>=3.0.0",
    "rapidfuzz>=3.0.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
ocr = [
    "Pillow",
    "pytesseract",
    "easyocr",
]
all = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "Pillow",
    "pytesseract",
]

[project.scripts]
questlog = "questlog.cli.app:app"
ql = "questlog.cli.app:app"

[tool.setuptools.packages.find]
include = ["ql*", "questlog*"]


