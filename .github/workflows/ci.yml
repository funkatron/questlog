name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ocr]"

      - name: Run tests
        run: pytest -q

      - name: Evaluate fixtures (never mode)
        run: questlog eval-fixtures --mode never -d tests/fixtures/screenshots -o /tmp/fixture_eval.md
